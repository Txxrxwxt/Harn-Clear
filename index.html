<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#168b9b">
  <title>หารเคลียร์ — หารค่าอาหารในกลุ่มเพื่อน</title>
  <meta name="description" content="หารค่าอาหารกับเพื่อน แล้วรู้ทันทีว่าใครต้องโอนให้ใคร">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="masthead">
    <div class="shell">
      <h1>หารเคลียร์</h1>
      <p>หารค่าอาหารกับเพื่อน แล้วรู้เลยว่าใครต้องโอนให้ใคร เท่าไหร่</p>
      <div class="header-actions">
        <button id="demo-button" class="button button-accent" type="button"><span aria-hidden="true">✦</span> ลองใช้ข้อมูลตัวอย่าง</button>
        <button id="reset-button" class="button button-light" type="button"><span aria-hidden="true">↻</span> ล้างข้อมูล</button>
      </div>
    </div>
  </header>

  <main class="shell main-shell">
    <nav class="step-tabs" aria-label="ขั้นตอน">
      <button type="button" class="step-tab active" data-tab="friends">1. รายชื่อ</button>
      <button type="button" class="step-tab" data-tab="input">2. กรอกข้อมูล</button>
      <button type="button" class="step-tab" data-tab="result">3. ผลลัพธ์</button>
    </nav>
    <section id="screen" aria-live="polite"></section>
  </main>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <h2 id="dialog-title"></h2>
      <p id="dialog-description"></p>
      <div class="dialog-actions">
        <button value="cancel" class="button button-light">ยกเลิก</button>
        <button id="dialog-confirm" value="confirm" class="button button-danger">ยืนยัน</button>
      </div>
    </form>
  </dialog>
  <dialog id="qr-dialog" class="dialog">
    <form method="dialog" class="dialog-card qr-card">
      <h2 id="qr-title">สแกนเพื่อโอนเงิน</h2>
      <p id="qr-amount" class="qr-amount"></p>
      <canvas id="qr-canvas"></canvas>
      <div class="dialog-actions">
        <button value="close" class="button button-wide">ปิดหน้าต่าง</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
